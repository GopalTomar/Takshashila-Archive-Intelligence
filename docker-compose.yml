services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: takshashila
      POSTGRES_PASSWORD: takshashila
      POSTGRES_DB: takshashila
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U takshashila"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://takshashila:takshashila@postgres:5432/takshashila
      REDIS_URL: redis://redis:6379/0
      JOBS_INLINE: "false"
      CORS_ORIGINS: http://localhost:3000
      DATA_DIR: /data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - archivedata:/data
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 10s
      timeout: 5s
      retries: 10

  worker:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://takshashila:takshashila@postgres:5432/takshashila
      REDIS_URL: redis://redis:6379/0
      JOBS_INLINE: "false"
      DATA_DIR: /data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - archivedata:/data
    command: celery -A app.jobs.celery_app.celery_app worker --loglevel=info

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
    depends_on:
      - api
    ports:
      - "3000:3000"

volumes:
  pgdata:
  archivedata:
